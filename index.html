<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Movie WatchList</title>
</head>
<body>
  <header>
    <h1>Find your film</h1>
    <a href="" class="watchlist-btn">My Watchlist <span>↗</span></a>
  </header>

  <main>
    <div class="input-wrapper">
      <label class="label-search" for="search-input">Search for a movie</label>
      <img class="input-icon" src="./imgs/search_icon.svg" alt="">
      <input type="text" name="search-input" id="search-input" placeholder="Search for a movie">
      <button id="search-btn"><img src="./imgs/search-arr.png" alt="search"></button>
    </div>
    <div class="exploring-container">
      <img src="./imgs/movie_icon.svg" alt="">
      <h2>Start exploring</h2>
    </div>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
